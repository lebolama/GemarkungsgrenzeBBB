<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Historische Differenzanalyse</title>
<link rel="stylesheet" href="assets/style.css">
<style>
select{padding:6px;margin-right:10px}
.box{background:#faf7f2;padding:15px;border-radius:10px;margin-top:15px}
.big{font-size:20px;font-weight:bold;color:#6b0000}
</style>
</head>
<body>

<header><h1>Historische Differenzanalyse</h1></header>

<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div class="container">
<div class="card">
Vergleiche Jahr
<select id="a"></select> ↔ <select id="b"></select>
<button onclick="run()">Analysieren</button>
</div>
<div id="out"></div>
</div>

<script>
const YEARS=["1569","1608","1683","1700","1749","1872","1887","2021"];
YEARS.forEach(y=>{
a.innerHTML+=`<option>${y}</option>`;
b.innerHTML+=`<option>${y}</option>`;
});
b.selectedIndex=1;

let data=[];
fetch("data.json").then(r=>r.json()).then(j=>data=j);

function sym(r,y){return r._derived?.symbols_by_year?.[y]||{}}
function has(r,y){return r._derived?.presence_by_year?.[y]}

function run(){

let y1=a.value;
let y2=b.value;

let stats={
new:0,lost:0,same:0,
wappenUp:0,wappenDown:0,
radUp:0,radDown:0,
kreuzUp:0,kreuzDown:0,
bUp:0,bDown:0,
b1:0,b2:0,b3:0
};

data.forEach(r=>{
let h1=has(r,y1);
let h2=has(r,y2);

if(!h1 && h2) stats.new++;
if(h1 && !h2) stats.lost++;
if(h1 && h2) stats.same++;

let s1=sym(r,y1);
let s2=sym(r,y2);

function cmp(k,up,down){
if((s2[k]||0)>(s1[k]||0)) stats[up]++;
if((s2[k]||0)<(s1[k]||0)) stats[down]++;
}

cmp("wappen_count","wappenUp","wappenDown");
cmp("rad_count","radUp","radDown");
cmp("kreuz_count","kreuzUp","kreuzDown");
cmp("b_count","bUp","bDown");

let b=s2.b_count||0;
if(b===1)stats.b1++;
if(b===2)stats.b2++;
if(b===3)stats.b3++;
});

out.innerHTML=`
<div class="box">
<div class="big">Bestandsveränderung</div>
Neu ${stats.new}<br>
Verschwunden ${stats.lost}<br>
Unverändert ${stats.same}
</div>

<div class="box">
<div class="big">Symbolveränderung</div>
Wappen ↑ ${stats.wappenUp} ↓ ${stats.wappenDown}<br>
Rad ↑ ${stats.radUp} ↓ ${stats.radDown}<br>
Kreuz ↑ ${stats.kreuzUp} ↓ ${stats.kreuzDown}<br>
B ↑ ${stats.bUp} ↓ ${stats.bDown}
</div>

<div class="box">
<div class="big">B-Differenzierung</div>
=1b ${stats.b1}<br>
=2b ${stats.b2}<br>
=3b ${stats.b3}
</div>
`;
}
</script>

</body>
</html>
