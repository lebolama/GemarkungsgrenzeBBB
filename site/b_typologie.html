<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>B-Typologieanalyse</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.box{background:#faf7f2;padding:18px;border-radius:12px;margin-top:18px}
h2{color:#6b0000;margin-top:0}
.big{font-size:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
</style>
</head>
<body>

<header><h1>Typologieanalyse: Buchstabe(n) b auf der (Tauber-)Bischofsheimer Seite von Grenzsteinen</h1></header>

<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div class="container">
<button onclick="run()">Analyse starten</button>
<div id="out"></div>
</div>

<script>
const YEARS=["1569","1608","1683","1700","1749","1872","1887","2021"];
let data=[];

fetch("data.json").then(r=>r.json()).then(j=>data=j);

// Anteilberechnung
function pct(n,t){return t?Math.round(n/t*100):0}

function stats(year){

let set=data.filter(r=>r._derived?.presence_by_year?.[year]);
let n=set.length;

let any=0,b1=0,b2=0,b3=0;

set.forEach(r=>{
let b=r._derived?.symbols_by_year?.[year]?.b_count||0;
if(b>0)any++;
if(b===1)b1++;
if(b===2)b2++;
if(b===3)b3++;
});

return {
total:n,
any:pct(any,n),
b1:pct(b1,n),
b2:pct(b2,n),
b3:pct(b3,n),
raw:{any,b1,b2,b3}
};
}

function dominantYear(){

let winner=null;
let max=0;

YEARS.forEach(y=>{
let s=stats(y);
if(s.b3>max){
max=s.b3;
winner=y;
}
});

return winner;
}

function trend(type){

let arr=[];

YEARS.forEach(y=>{
let s=stats(y);
arr.push(s[type]);
});

let diff=arr[arr.length-1]-arr[0];

if(Math.abs(diff)<10) return "stabil";

return diff>0?"zunehmend":"abnehmend";
}

function run(){

let html="";

html+="<div class='box'><h2>Zeitliche Verteilung</h2>";

YEARS.forEach(y=>{
let s=stats(y);
html+=`
<b>${y}</b><br>
≥1b ${s.any}% ·
1b ${s.b1}% ·
2b ${s.b2}% ·
3b ${s.b3}%<br><br>`;
});

html+="</div>";

// Dominanzanalyse
html+=`
<div class="box">
<h2>Dominanzphase</h2>
Jahr mit höchstem Anteil an 3-b-Steinen:
<div class="big">${dominantYear()}</div>
</div>
`;

// Trendanalyse
html+=`
<div class="box">
<h2>Langfristige Trends</h2>
≥1b: ${trend("any")}<br>
1b: ${trend("b1")}<br>
2b: ${trend("b2")}<br>
3b: ${trend("b3")}
</div>
`;

// Interpretation
html+=`
<div class="box">
<h2>Interpretation</h2>
Die Intensität der B-Markierung gilt als Indikator für territoriale Symbolstärke.
Steigende Werte deuten auf stärkere Grenzmanifestation,
sinkende Werte auf administrative Vereinfachung oder Erosion symbolischer Praxis.
</div>
`;

out.innerHTML=html;
}
</script>

</body>
</html>
