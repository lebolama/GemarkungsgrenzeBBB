<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/print.css" media="print">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header><h1>Analyse-Dashboard</h1></header>

<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div class="container">

<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <input id="q" placeholder="Live-Filter (Volltext) …" style="min-width:280px">
  <button onclick="window.print()">Druckansicht</button>
  <button id="exp1">PNG: Gemarkungen</button>
  <button id="exp2">PNG: Grenzgänge</button>
  <button id="exp3">PNG: Symbolik</button>
</div>

<div class="card"><canvas id="c1"></canvas></div>
<div class="card"><canvas id="c2"></canvas></div>
<div class="card"><canvas id="c3"></canvas></div>

</div>

<script>
let raw=[];
let ch1, ch2, ch3;

function fulltextFilter(list, term){
  if(!term) return list;
  term=term.toLowerCase();
  return list.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(term)));
}

function build(list){
  // 1) Grenzpartner
  const borders={};
  list.forEach(r=>{
    const b=Object.values(r)[1];
    borders[b]=(borders[b]||0)+1;
  });

  // 2) Grenzgänge
  const years=["1569","1608","1683","1700","1749","1872"];
  const yc={}; years.forEach(y=>yc[y]=0);
  list.forEach(r=>{
    Object.keys(r).forEach(k=>{
      years.forEach(y=>{
        if(k.includes(y) && r[k]) yc[y]++;
      });
    });
  });

  // 3) Symbolik grob (alle "x" irgendwo vs. keine "x" irgendwo)
  let withX=0;
  list.forEach(r=>{
    const hasX=Object.values(r).some(v=>v==="x");
    if(hasX) withX++;
  });
  const withoutX = Math.max(0, list.length - withX);

  // Charts erstellen/aktualisieren
  if(ch1) ch1.destroy();
  if(ch2) ch2.destroy();
  if(ch3) ch3.destroy();

  ch1 = new Chart(document.getElementById("c1"),{
    type:"bar",
    data:{
      labels:Object.keys(borders),
      datasets:[{label:"Grenzsteine", data:Object.values(borders)}]
    },
    options:{plugins:{legend:{display:true}}}
  });

  ch2 = new Chart(document.getElementById("c2"),{
    type:"line",
    data:{
      labels:Object.keys(yc),
      datasets:[{label:"Dokumentations-Einträge", data:Object.values(yc), fill:false}]
    },
    options:{plugins:{legend:{display:true}}}
  });

  ch3 = new Chart(document.getElementById("c3"),{
    type:"pie",
    data:{
      labels:["mind. ein „x“ vorhanden","kein „x“ vorhanden"],
      datasets:[{data:[withX, withoutX]}]
    }
  });
}

function exportChart(chart, filename){
  const a=document.createElement("a");
  a.href=chart.toBase64Image();
  a.download=filename;
  a.click();
}

fetch("data.json").then(r=>r.json()).then(data=>{
  raw=data;
  build(raw);

  document.getElementById("q").addEventListener("input", e=>{
    build(fulltextFilter(raw, e.target.value));
  });

  exp1.onclick=()=>exportChart(ch1,"statistik_gemarkungen.png");
  exp2.onclick=()=>exportChart(ch2,"statistik_grenzgaenge.png");
  exp3.onclick=()=>exportChart(ch3,"statistik_symbolik.png");
});
</script>

</body>
</html>
