<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Vergleichsanalyse – Grenzsteine</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<header><h1>Vergleichsanalyse – Grenzsteine</h1></header>

<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div class="container">
<div class="grid">

<div class="card">
<h3>Filter A</h3>
<div id="A"></div>
</div>

<div class="card">
<h3>Filter B</h3>
<div id="B"></div>
</div>

</div>

<div class="card"><div id="diff"></div></div>

<div class="results">
<div id="resA"></div>
<div id="resB"></div>
</div>
</div>

<script>
let data=[];
fetch("data.json").then(r=>r.json()).then(j=>{
data=j;
buildFilters("A");
buildFilters("B");
run();
});

const YEARS=["","1569","1608","1683","1700","1749","1872","1887","2021"];

function buildFilters(side){
document.getElementById(side).innerHTML=`
<input placeholder="Text" id="${side}_text">
<select id="${side}_year">${YEARS.map(y=>`<option value="${y}">${y||"Alle Jahre"}</option>`).join("")}</select>

<label><input type=checkbox id="${side}_b_any"> ≥1 b</label>
<label><input type=checkbox id="${side}_b1"> =1 b</label>
<label><input type=checkbox id="${side}_b2"> =2 b</label>
<label><input type=checkbox id="${side}_b3"> =3 b</label>
`;
document.querySelectorAll("#"+side+" input,#"+side+" select").forEach(i=>i.oninput=run);
}

function bCount(r){
let sy=r._derived?.symbols_by_year;
if(!sy)return 0;
let m=0;
for(let y in sy)m=Math.max(m,sy[y].b_count||0);
return m;
}

function filter(side){
let t=document.getElementById(side+"_text").value.toLowerCase();
let y=document.getElementById(side+"_year").value;

return data.filter(r=>{

if(t && !JSON.stringify(r).toLowerCase().includes(t)) return false;

if(y && !r._derived?.presence_by_year?.[y]) return false;

let b=bCount(r);
if(document.getElementById(side+"_b_any").checked && b===0) return false;
if(document.getElementById(side+"_b1").checked && b!==1) return false;
if(document.getElementById(side+"_b2").checked && b!==2) return false;
if(document.getElementById(side+"_b3").checked && b!==3) return false;

return true;
});
}

function render(list,id){
let el=document.getElementById(id);
el.innerHTML="";
list.forEach(r=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML="<b>"+r.ID+"</b>";
d.onclick=()=>location="stein.html?id="+r.ID;
el.appendChild(d);
});
}

function run(){
let A=filter("A");
let B=filter("B");

render(A,"resA");
render(B,"resB");

let idsA=new Set(A.map(r=>r.ID));
let idsB=new Set(B.map(r=>r.ID));

let onlyA=[...idsA].filter(x=>!idsB.has(x)).length;
let onlyB=[...idsB].filter(x=>!idsA.has(x)).length;
let both=[...idsA].filter(x=>idsB.has(x)).length;

diff.textContent=`Nur A: ${onlyA} | Nur B: ${onlyB} | Beide: ${both}`;
}
</script>

</body>
</html>
