<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>#map{height:600px}</style>
</head>
<body>

<header><h1>Kartenanalyse</h1></header>
<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="karte.html">Karte</a> |
<a href="statistik.html">Statistik</a> |
<a href="edition.html">Edition</a> |
<a href="quellen.html">Quellen</a>
</div>
<div id="map"></div>

<script>
let map=L.map("map").setView([49.62,9.66],13);

L.tileLayer(
"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
).addTo(map);

fetch("data.json").then(r=>r.json()).then(data=>{

data.forEach(r=>{
let gps=Object.values(r).find(v=>String(v).includes(","));
if(!gps) return;

let [lat,lon]=gps.split(",");
L.marker([lat,lon]).addTo(map)
.bindPopup("Grenzstein "+Object.values(r)[0]);
});

});
</script>

</body>
</html>
