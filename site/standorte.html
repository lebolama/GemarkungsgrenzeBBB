        const positions = positionData?.years?.[cfg.key] || {};
        const surveyStones = stones.filter((stone) => yearPresence(stone.row, cfg));
        const distanceToPrevious = new Map();
        for (let i = 1; i < surveyStones.length; i++) {
          distanceToPrevious.set(
            surveyStones[i].id,
            distanceBetween(surveyStones[i - 1], surveyStones[i], cfg)
          );
        }

        for (let i = 0; i < stones.length; i++) {
          if (!yearPresence(stones[i].row, cfg)) continue;
          const position = positions[String(stones[i].id)];
          if (!position || !Number.isFinite(position.lat) || !Number.isFinite(position.lon)) continue;
          if (position.certainty === "D") continue;
          const shownId = String(stones[i].id);
          const latlng = [position.lat, position.lon];

            <span>Flur- &amp; Gewannnamen anzeigen</span>
          </label>
          <div id="field-name-options" class="field-name-options" hidden>
            <label class="field-name-subtoggle">
              <input id="toggle-field-name-labels" type="checkbox" checked>
              <span>Flurnamen auf der Karte</span>
            </label>
            <label class="field-name-subtoggle">
              <input id="toggle-field-name-sidebar" type="checkbox" checked>
              <span>Flurnamen-Navigationsleiste</span>
            </label>
            <div class="legend-note">Die Beschriftungen erscheinen ab Zoomstufe 14. Ein Name aus der Liste wird sofort herangezoomt und hervorgehoben.</div>
          </div>
          <label class="description-toggle">
            <input id="toggle-pois" type="checkbox" aria-controls="poi-options" aria-expanded="false">
            <span>POIs (Points of Interest) anzeigen</span>
          </label>
          <div id="poi-options" class="poi-options" hidden>
            <label class="poi-subtoggle">
              <input id="toggle-poi-labels" type="checkbox" checked>
              <span>POI-Namen auf der Karte</span>
            </label>
            <label class="poi-subtoggle">
              <input id="toggle-poi-sidebar" type="checkbox" checked>
              <span>POI-Navigationsleiste</span>
            </label>
            <div class="legend-note">Die Beschriftungen erscheinen ab Zoomstufe 14. Ein Klick auf einen POI zeigt seine Zusatzinformationen und Fotos. Einzelne POIs oder ganze Kategorien können in der Liste hervorgehoben werden.</div>
          </div>
        `;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        wireMobilePanel("toggle-legend-panel", div, div.querySelector(".mobile-panel-close"));
        const toggle = div.querySelector("#toggle-historical-descriptions");
        const historicalDescriptionNote = div.querySelector("#historical-description-note");
        toggle.checked = descriptionsEnabled;
        historicalDescriptionNote.hidden = !descriptionsEnabled;
        toggle.setAttribute("aria-expanded", String(descriptionsEnabled));
        toggle.addEventListener("change", () => {
          descriptionsEnabled = toggle.checked;
          historicalDescriptionNote.hidden = !descriptionsEnabled;
          toggle.setAttribute("aria-expanded", String(descriptionsEnabled));
          map.closePopup();
        });

        const fieldNamesToggle = div.querySelector("#toggle-field-names");
        const fieldNameOptions = div.querySelector("#field-name-options");
        const fieldNameLabelsToggle = div.querySelector("#toggle-field-name-labels");
        const fieldNameSidebarToggle = div.querySelector("#toggle-field-name-sidebar");
        fieldNamesToggle.checked = fieldNamesEnabled;
        fieldNameOptions.hidden = !fieldNamesEnabled;
        fieldNamesToggle.setAttribute("aria-expanded", String(fieldNamesEnabled));
        fieldNameLabelsToggle.checked = fieldNameLabelsEnabled;
        fieldNameSidebarToggle.checked = fieldNameSidebarEnabled;
        fieldNamesToggle.addEventListener("change", () => {
          fieldNamesEnabled = fieldNamesToggle.checked;
          fieldNameOptions.hidden = !fieldNamesEnabled;
          fieldNamesToggle.setAttribute("aria-expanded", String(fieldNamesEnabled));
          syncFieldNameVisibility();
        });
        fieldNameLabelsToggle.addEventListener("change", () => {
          fieldNameLabelsEnabled = fieldNameLabelsToggle.checked;
          syncFieldNameVisibility();
        });
        fieldNameSidebarToggle.addEventListener("change", () => {
          fieldNameSidebarEnabled = fieldNameSidebarToggle.checked;
          syncFieldNameVisibility();
        });

        const poisToggle = div.querySelector("#toggle-pois");
        const poiOptions = div.querySelector("#poi-options");
        const poiLabelsToggle = div.querySelector("#toggle-poi-labels");
        const poiSidebarToggle = div.querySelector("#toggle-poi-sidebar");
        poisToggle.checked = poisEnabled;
        poiOptions.hidden = !poisEnabled;
        poisToggle.setAttribute("aria-expanded", String(poisEnabled));
        poiLabelsToggle.checked = poiLabelsEnabled;
        poiSidebarToggle.checked = poiSidebarEnabled;
        poisToggle.addEventListener("change", () => {
          poisEnabled = poisToggle.checked;
          poiOptions.hidden = !poisEnabled;
          poisToggle.setAttribute("aria-expanded", String(poisEnabled));
          syncPoiVisibility();
        });
        poiLabelsToggle.addEventListener("change", () => {
          poiLabelsEnabled = poiLabelsToggle.checked;
          syncPoiVisibility();
        });
        poiSidebarToggle.addEventListener("change", () => {
          poiSidebarEnabled = poiSidebarToggle.checked;
          syncPoiVisibility();
        });
        return div;
      };
      legend.addTo(map);
    }).catch((err) => {
      console.error(err);
      L.popup()
        .setLatLng(map.getCenter())
        .setContent("Fehler beim Laden der Kartendaten. Bitte prüfen, ob data.json, standorte-positionen.json, Flurnamen/flurnamen.json, Flurnamen/pois.txt und die GeoJSON-Grenzdatei vorhanden sind.")
        .openOn(map);
    });
  </script>
</body>
</html>
