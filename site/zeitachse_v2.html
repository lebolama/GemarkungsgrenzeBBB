<div class="container">
<div class="card">
<canvas id="chart"></canvas>
</div>
</div>

<script>
fetch("data.json").then(r=>r.json()).then(data=>{

let years=["1569","1608","1683","1700","1749","1872"];
let counts={};
years.forEach(y=>counts[y]=0);

data.forEach(r=>{
Object.keys(r).forEach(k=>{
years.forEach(y=>{
if(k.includes(y)&&r[k]) counts[y]++;
});
});
});

new Chart(chart,{
type:"line",
data:{
labels:Object.keys(counts),
datasets:[{
label:"Dokumentierte Steine",
data:Object.values(counts),
fill:false
}]
}
});
});
</script>

</body>
