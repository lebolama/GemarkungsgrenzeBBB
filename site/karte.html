<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/print.css" media="print">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<style>#map{height:650px}</style>
</head>
<body>

<header><h1>Kartenanalyse</h1></header>

<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div class="container">
  <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <input id="q" placeholder="Filter (Volltext) …" style="min-width:280px">
    <button onclick="window.print()">Druckansicht</button>
    <span style="font-size:14px;color:#555">Tipp: Zoom für Cluster-Auflösung</span>
  </div>
</div>

<div id="map"></div>

<div id="debugBox" style="
position:absolute;
top:10px;
left:10px;
z-index:999;
background:white;
padding:10px 14px;
border-radius:8px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
font-size:14px;
line-height:1.4">
<b>Datenstatus</b><br>
Gesamt: <span id="dbg_total">–</span><br>
Mit GPS: <span id="dbg_gps">–</span><br>
Ohne GPS: <span id="dbg_nogps">–</span><br>
Marker aktiv: <span id="dbg_visible">–</span>
</div>

<script>
const map=L.map("map").setView([49.62,9.66],13);

// Basemaps
const light=L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(map);
const osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png");

const baseLayers={
 "Hell":light,
 "OSM":osm
};

let cluster=L.markerClusterGroup().addTo(map);
L.control.layers(baseLayers,{"Grenzsteine":cluster}).addTo(map);

let raw=[];


// ---------- GPS ----------
function gps(r){
 if(r._gps_parsed?.lat) return [r._gps_parsed.lat,r._gps_parsed.lon];
 const s=r?._derived?.survey2021?.gps_normalized;
 if(s){
  const p=s.split(",");
  if(p.length===2){
   const lat=parseFloat(p[0]);
   const lon=parseFloat(p[1]);
   if(!isNaN(lat)&&!isNaN(lon)) return [lat,lon];
  }
 }
 return null;
}


// ---------- Jahrhundertfarbe ----------
function color(r){
 const y=r._derived?.earliest_possible_setting_year;
 if(!y) return "#666";

 const c=Math.floor(y/100)+1;

 if(c<=15) return "#5e3c99";
 if(c===16) return "#1b9e77";
 if(c===17) return "#d95f02";
 if(c===18) return "#7570b3";
 if(c===19) return "#e7298a";
 return "#666";
}


// ---------- Filter ----------
function matchSymbol(r,type){
  const sy=r?._derived?.symbols_by_year;
  if(!sy) return false;

  for(const y in sy){
    const obj=sy[y];

    if(type==="wappen" && (obj.wappen_count||0)>0) return true;
    if(type==="rad" && (obj.rad_count||0)>0) return true;
    if(type==="kreuz" && (obj.kreuz_count||0)>0) return true;
    if(type==="b" && (obj.b_count||0)>0) return true;
  }
  return false;
}

function passes(r){
 const year=yearSlider.value;

 if(year!=="all"){
  if(!r._derived?.presence_by_year?.[year]) return false;
 }

 if(wappen.checked && !matchSymbol(r,"wappen")) return false;
 if(rad.checked && !matchSymbol(r,"rad")) return false;
 if(kreuz.checked && !matchSymbol(r,"kreuz")) return false;
 if(b.checked && !matchSymbol(r,"b")) return false;

 return true;
}


// ---------- Render ----------
function render(){

 cluster.clearLayers();
 let visible=0;
 let gpsCount=0;

 raw.forEach(r=>{
  const coords=gps(r);
  if(!coords) return;

  gpsCount++;
  if(!passes(r)) return;

  const id=r.ID;
  const border=r.Grenze;

  const marker=L.circleMarker(coords,{
   radius:7,
   color:color(r),
   fillOpacity:.9
  });

  marker.bindTooltip("Stein "+id);

  marker.bindPopup(`
  <b>Grenzstein ${id}</b><br>
  Grenze: ${border}<br>
  Erstnachweis: ${r._derived.first_documented_year || "?"}<br>
  <a href="stein.html?id=${id}">Dossier öffnen</a>
  `);

  cluster.addLayer(marker);
  visible++;
 });

 dbg_total.textContent=raw.length;
 dbg_gps.textContent=gpsCount;
 dbg_nogps.textContent=raw.length-gpsCount;
 dbg_visible.textContent=visible;
}


// ---------- UI ----------
function ui(){
 return `
<div style="
position:absolute;
top:10px;
right:10px;
z-index:999;
background:white;
padding:12px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
font-size:14px">

<b>Filter</b><br><br>

Jahr:<br>
<select id="yearSlider">
<option value="all">alle</option>
<option>1569</option>
<option>1608</option>
<option>1683</option>
<option>1700</option>
<option>1749</option>
<option>1872</option>
</select>

<br><br>
<b>Symbole</b><br>
<label><input type="checkbox" id="wappen"> Wappen</label><br>
<label><input type="checkbox" id="rad"> Rad</label><br>
<label><input type="checkbox" id="kreuz"> Kreuz</label><br>
<label><input type="checkbox" id="b"> B</label>

<br><br>
<b>Legende Jahrhundert</b><br>
<span style="color:#5e3c99">●</span> ≤15 Jh<br>
<span style="color:#1b9e77">●</span> 16 Jh<br>
<span style="color:#d95f02">●</span> 17 Jh<br>
<span style="color:#7570b3">●</span> 18 Jh<br>
<span style="color:#e7298a">●</span> 19 Jh

</div>`;
}

document.body.insertAdjacentHTML("beforeend",ui());


// ---------- Events ----------
document.addEventListener("change",render);


// ---------- Load ----------
fetch("data.json")
.then(r=>r.json())
.then(d=>{
 raw=d;
 render();
});
</script>

</body>
</html>
