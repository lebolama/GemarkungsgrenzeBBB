<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Distanzkarte</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;font-family:serif;background:#f5f2ea}
header{padding:10px;text-align:center;background:#7a0019;color:white}
#map{height:85vh}
select{margin:10px;padding:5px;font-size:16px}
</style>
</head>
<body>

<header>
<h1>Distanzkarte</h1>
<select id="year"></select>
</header>


<div style="text-align:center;margin-top:10px">
<a href="index.html">Start</a> |
<a href="suche.html">Recherche</a> |
<a href="vergleich.html">Vergleich</a> |
<a href="karte.html">Karte</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const YEARS=["1569","1608","1683","1700","1749","1872","1887"];

const map=L.map("map").setView([49.62,9.66],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const lines=L.layerGroup().addTo(map);
const points=[];

function getDist(row,year){
let obj=row[year];
if(!obj) return null;

for(let k in obj){
if(k.toLowerCase().includes("meter"))
return Number(obj[k]);
}
return null;
}

YEARS.forEach(y=>{
let o=document.createElement("option");
o.value=y;
o.textContent=y;
year.appendChild(o);
});

fetch("data.json")
.then(r=>r.json())
.then(data=>{

data.forEach(r=>{
if(!r.gps || !r.gps.includes(",")) return;

let [lat,lon]=r.gps.split(",").map(Number);

points.push({lat,lon,row:r});

L.circleMarker([lat,lon],{
radius:5,
color:"#0044cc",
fillOpacity:.9
}).addTo(map).bindPopup("Stein "+r.id);
});

draw();
year.onchange=draw;

function draw(){

lines.clearLayers();

let y=year.value;

for(let i=1;i<points.length;i++){

let a=points[i-1];
let b=points[i];

let d=getDist(b.row,y);
if(!d) continue;

let line=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:"red"})
.addTo(lines);

line.bindTooltip(d+" m");
}
}

});
</script>

</body>
</html>
